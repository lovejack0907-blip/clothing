<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衣著提案</title>
<style>
:root{--bg:#111210;--p:#1d1f1b;--p2:#252821;--t:#f4f4ef;--m:#aaa;--a:#7f8b63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,"Microsoft JhengHei",sans-serif}button{font:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.brand{font-size:30px;font-weight:800;margin:34px 0 6px;display:inline-block;cursor:pointer}.sub{color:#b7b8b2;margin:0 0 28px}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:50px}.cat{background:var(--p);border-radius:16px;overflow:hidden;cursor:pointer}.cover{height:350px;display:flex;align-items:center;justify-content:center;background:#20221e;overflow:hidden}.cover img,.card img{width:100%;height:100%;object-fit:contain;transition:.25s}.cat:hover img,.card:hover img{transform:scale(1.025)}.name{padding:18px 20px;font-size:21px;font-weight:700}.missing{height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#777;padding:12px}.sticky{position:sticky;top:0;z-index:10;background:#111210e8;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff0d;padding:13px 0}.tabs,.row{display:flex;flex-wrap:wrap;gap:9px}.pill{border:0;border-radius:999px;background:#292b27;color:#ddd;padding:9px 15px;cursor:pointer}.pill.on{background:var(--a);color:#fff}.filters{padding:20px 0 24px}.row{margin-bottom:10px}.apply{background:transparent;color:#ddd;border:1px solid var(--a);border-radius:10px;padding:9px 15px;cursor:pointer}.gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding-bottom:50px}.card{width:calc((100% - 40px)/3);min-height:310px;background:var(--p);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}.card img{height:auto}.empty{width:100%;text-align:center;color:#aaa;padding:70px 10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50}.modal.on{display:flex}.dialog{width:85vw;height:85vh;max-width:1250px;background:#20221f;border-radius:18px;overflow:hidden;position:relative;display:grid;grid-template-columns:65% 35%;animation:f .16s}@keyframes f{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:scale(1)}}.big{background:#191a18;padding:20px;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.big img{max-width:100%;max-height:100%;object-fit:contain}.info{padding:46px 34px 70px;overflow:auto}.info h2{margin:0 0 22px;font-size:21px}.details{white-space:pre-line;line-height:2;color:#ddd}.x{position:absolute;right:17px;top:10px;background:none;border:0;color:#aaa;font-size:29px;cursor:pointer}.x:hover,.nav button:hover{color:#fff}.nav{position:absolute;right:30px;bottom:22px;width:calc(35% - 60px);display:flex;justify-content:space-between}.nav button{border:0;background:none;color:#aaa;cursor:pointer}
@media(max-width:760px){.wrap{width:calc(100% - 22px)}.brand{font-size:26px;margin-top:25px}.homegrid{gap:12px}.cover{height:235px}.name{font-size:18px;padding:14px}.gallery{gap:11px}.card{width:calc((100% - 11px)/2);min-height:205px}.dialog{width:92vw;height:88vh;grid-template-columns:1fr;grid-template-rows:60% 40%}.big{padding:12px}.info{padding:18px 22px 55px}.nav{left:22px;right:22px;bottom:15px;width:auto}}
</style></head><body>
<main id="home" class="wrap"><div class="brand homebtn">衣著提案</div><p class="sub">每天一點穿搭靈感，找到適合自己的日常風格。</p><section id="homegrid" class="homegrid"></section></main>
<main id="style" style="display:none"><div class="sticky"><div class="wrap"><div class="brand homebtn" style="margin:0 0 12px">衣著提案</div><div id="tabs" class="tabs"></div></div></div><div class="wrap"><section class="filters"><div id="seasons" class="row"></div><div id="outers" class="row"></div><button id="apply" class="apply">套用篩選</button></section><section id="gallery" class="gallery"></section></div></main>
<div id="modal" class="modal"><div class="dialog"><button id="x" class="x">×</button><div id="big" class="big"></div><div class="info"><h2 id="mt"></h2><div id="details" class="details"></div></div><div class="nav"><button id="prev">上一套</button><button id="next">下一套</button></div></div></div>
<script>
const S={minimal:["簡約","minimal"],street:["街頭","street"],retro:["復古","retro"],korean:["韓系","korean"]};
const O={minimal:[{id:1,img:"images/minimal/01.jpg",sea:["春","夏","秋"],outer:false,top:"黑色短袖上衣",pants:"黑色長褲",jacket:null,shoes:"黑色休閒鞋"},{id:2,img:"images/minimal/02.jpg",sea:["春","夏","秋"],outer:true,top:"白色 T 恤",pants:"黑色長褲",jacket:"黑色外套",shoes:"黑色皮鞋"},{id:3,img:"images/minimal/03.jpg",sea:["春","夏"],outer:false,top:"米色短袖上衣",pants:"淺灰短褲",jacket:null,shoes:"黑白休閒鞋"},{id:4,img:"images/minimal/04.jpg",sea:["春","夏"],outer:false,top:"淺色花紋短袖襯衫",pants:"卡其長褲",jacket:null,shoes:"棕色皮鞋"},{id:5,img:"images/minimal/05.jpg",sea:["春","夏"],outer:true,top:"白色 T 恤",pants:"綠色長褲",jacket:"格紋襯衫",shoes:null},{id:6,img:"images/minimal/06.jpg",sea:["春","夏","秋"],outer:false,top:"白色 T 恤",pants:"黑色牛仔褲",jacket:null,shoes:"黑紅休閒鞋"},{id:7,img:"images/minimal/07.jpg",sea:["春","秋"],outer:true,top:"白色襯衫",pants:"灰色格紋長褲",jacket:"灰色西裝外套",shoes:"白色休閒鞋"},{id:8,img:"images/minimal/08.jpg",sea:["春","秋"],outer:false,top:"米色短袖上衣",pants:"米色長褲",jacket:null,shoes:"黑色鞋"}],street:[{id:1,img:"images/street/01.jpg",sea:["春","夏","秋"],outer:false,top:"黑色印花 T 恤",pants:"淺藍色工裝牛仔褲",jacket:null,shoes:"黑色鞋"},{id:2,img:"images/street/02.jpg",sea:["春","夏","秋"],outer:false,top:"淺色印花 T 恤",pants:"黑色長褲",jacket:null,shoes:"白色休閒鞋"},{id:3,img:"images/street/03.jpg",sea:["秋","冬"],outer:true,top:"白色高領上衣",pants:"黑色長褲",jacket:"黑色長版外套",shoes:"灰白休閒鞋"},{id:4,img:"images/street/04.jpg",sea:["春","夏","秋"],outer:true,top:"灰色背心",pants:"紅色寬鬆長褲",jacket:"黑色短袖外套",shoes:"黑色皮鞋"},{id:5,img:"images/street/05.jpg",sea:["春","夏","秋"],outer:false,top:"白色 T 恤",pants:"深色寬鬆長褲",jacket:null,shoes:"黑色鞋"},{id:6,img:"images/street/06.jpg",sea:["秋","冬"],outer:true,top:"深色上衣",pants:"深色寬鬆長褲",jacket:"黃綠色羽絨外套",shoes:"深色鞋"},{id:7,img:"images/street/07.jpg",sea:["春","秋","冬"],outer:false,top:"紅色運動上衣",pants:"黑色寬鬆長褲",jacket:null,shoes:"白色休閒鞋"},{id:8,img:"images/street/08.jpg",sea:["春","夏","秋"],outer:false,top:"淺色印花 T 恤",pants:"黑色長褲",jacket:null,shoes:"白色休閒鞋"}],retro:[{id:1,img:"images/retro/01.jpg",sea:["春","秋"],outer:true,top:"淺色襯衫",pants:"紅色長褲",jacket:"淺色西裝外套",shoes:"棕色皮鞋"},{id:2,img:"images/retro/02.jpg",sea:["秋","冬"],outer:true,top:"白色襯衫",pants:"深色長褲",jacket:"棕色外套",shoes:"深色皮鞋"},{id:3,img:"images/retro/03.jpg",sea:["春","秋"],outer:true,top:"白色襯衫",pants:"深色長褲",jacket:"米色背心",shoes:"白色休閒鞋"},{id:4,img:"images/retro/04.jpg",sea:["春","秋"],outer:true,top:"白色襯衫",pants:"深色長褲",jacket:"淺色背心",shoes:"深色鞋"},{id:5,img:"images/retro/05.jpg",sea:["春","夏","秋"],outer:false,top:"米色短袖襯衫",pants:"深色長褲",jacket:null,shoes:"深色鞋"},{id:6,img:"images/retro/06.jpg",sea:["春","秋"],outer:false,top:"灰色長袖上衣",pants:"黑色長褲",jacket:null,shoes:"深色鞋"},{id:7,img:"images/retro/07.jpg",sea:["春","夏","秋"],outer:true,top:"白色襯衫",pants:"棕色長褲",jacket:"吊帶",shoes:"深色鞋"},{id:8,img:"images/retro/08.jpg",sea:["春","秋"],outer:true,top:"橘色上衣",pants:"棕色長褲",jacket:"深色牛仔外套",shoes:null}],korean:[{id:1,img:"images/korean/01.jpg",sea:["春","秋"],outer:true,top:"白色上衣",pants:"白色寬鬆長褲",jacket:"白色襯衫外套",shoes:"白色休閒鞋"},{id:2,img:"images/korean/02.jpg",sea:["春","夏","秋"],outer:false,top:"米色寬鬆 T 恤",pants:"深色長褲",jacket:null,shoes:null},{id:3,img:"images/korean/03.jpg",sea:["秋","冬"],outer:true,top:"深色上衣",pants:"深色寬鬆長褲",jacket:"黑色皮外套",shoes:"黑色鞋"},{id:4,img:"images/korean/04.jpg",sea:["春","秋"],outer:true,top:"白色上衣",pants:"淺藍寬鬆牛仔褲",jacket:"淺灰針織上衣",shoes:"深色鞋"},{id:5,img:"images/korean/05.jpg",sea:["春","夏","秋"],outer:false,top:"黑色短袖上衣",pants:"黑色長褲",jacket:null,shoes:"黑色鞋"},{id:6,img:"images/korean/06.jpg",sea:["春","夏","秋"],outer:false,top:"深色短袖襯衫",pants:"深色長褲",jacket:null,shoes:"白色休閒鞋"},{id:7,img:"images/korean/07.jpg",sea:["春","秋"],outer:false,top:"黑色長袖上衣",pants:"米色寬鬆長褲",jacket:null,shoes:"黑色鞋"}]};
let cur=null,ss=new Set,oo=new Set,list=[],mi=0;
const q=s=>document.querySelector(s);
function image(src,alt){let w=document.createElement("div");w.style.cssText="width:100%;height:100%";let i=document.createElement("img");i.src=src;i.alt=alt;i.loading="eager";i.onerror=()=>w.innerHTML=`<div class="missing">圖片尚未加入<br>${src}</div>`;w.append(i);return w}
function homeCards(){let g=q("#homegrid");g.innerHTML="";Object.entries(S).forEach(([k,v])=>{let c=document.createElement("article");c.className="cat";c.innerHTML=`<div class="cover"></div><div class="name">${v[0]}</div>`;c.querySelector(".cover").append(image(O[k][0].img,v[0]));c.onclick=()=>openStyle(k);g.append(c)})}
function tabs(){let b=q("#tabs");b.innerHTML="";Object.entries(S).forEach(([k,v])=>{let x=document.createElement("button");x.className="pill"+(k===cur?" on":"");x.textContent=v[0];x.onclick=()=>openStyle(k);b.append(x)})}
function filters(){let a=q("#seasons");a.innerHTML="";["春","夏","秋","冬"].forEach(v=>{let b=document.createElement("button");b.className="pill"+(ss.has(v)?" on":"");b.textContent=v;b.onclick=()=>{ss.has(v)?ss.delete(v):ss.add(v);filters()};a.append(b)});let o=q("#outers");o.innerHTML="";[["true","有外套"],["false","無外套"]].forEach(([v,t])=>{let b=document.createElement("button");b.className="pill"+(oo.has(v)?" on":"");b.textContent=t;b.onclick=()=>{oo.has(v)?oo.delete(v):oo.add(v);filters()};o.append(b)})}
function draw(){let g=q("#gallery");g.innerHTML="";if(!list.length){g.innerHTML='<div class="empty">目前沒有符合條件的穿搭，請調整篩選條件。</div>';return}list.forEach((o,n)=>{let c=document.createElement("article");c.className="card";c.append(image(o.img,S[cur][0]));c.onclick=()=>modal(n);g.append(c)})}
function openStyle(k){cur=k;ss.clear();oo.clear();list=[...O[k]];q("#home").style.display="none";q("#style").style.display="block";tabs();filters();draw();scrollTo(0,0)}
function apply(){list=O[cur].filter(o=>(!ss.size||o.sea.some(s=>ss.has(s)))&&(!oo.size||oo.size===2||oo.has(String(o.outer))));draw();q("#gallery").scrollIntoView({block:"start"})}
function goHome(){closeM();cur=null;ss.clear();oo.clear();q("#style").style.display="none";q("#home").style.display="block";scrollTo(0,0)}
function modal(n){mi=n;showM();q("#modal").classList.add("on");document.body.style.overflow="hidden"}
function showM(){let o=list[mi],b=q("#big");b.innerHTML="";b.append(image(o.img,"穿搭大圖"));q("#mt").textContent=`${S[cur][0]}穿搭`;let d=[`上衣：${o.top}`,`褲子：${o.pants}`];if(o.jacket)d.push(`外套：${o.jacket}`);if(o.shoes)d.push(`鞋子：${o.shoes}`);q("#details").textContent=d.join("\n")}
function closeM(){q("#modal").classList.remove("on");document.body.style.overflow=""}
function move(n){mi=(mi+n+list.length)%list.length;showM()}
q("#apply").onclick=apply;q("#x").onclick=closeM;q("#prev").onclick=()=>move(-1);q("#next").onclick=()=>move(1);document.querySelectorAll(".homebtn").forEach(x=>x.onclick=goHome);homeCards();goHome();
</script></body></html>
